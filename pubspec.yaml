name: jiacangben
description: 家藏本 —— 单机本地家庭台账（消耗物资保质期 + 收纳物件管理）
publish_to: 'none'
version: 1.8.0+13

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.8.3
  image_picker: ^1.1.2
  shared_preferences: ^2.2.0
  home_widget: ^0.10.0
  flutter_image_compress: ^2.5.1
  fl_chart: ^1.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#8D6E63"
  adaptive_icon_foreground: "assets/icon/adaptive_fg.png"

flutter:
  uses-material-design: true
